name: Check & Deploy

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-fonts-recommended

      - name: Run tests
        run: uv run --group dev pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7

      - name: Verify release version matches source code version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          SRC_VERSION=$(uv run --no-project python -c "exec(open('wilson/_version.py').read()); print(__version__)")
          if [[ "${TAG_VERSION}" != "${SRC_VERSION}" ]]; then
            echo "tag/release version (${TAG_VERSION}) and source code version (${SRC_VERSION}) disagree, exiting"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata
        run: uvx twine check --strict dist/*

      - name: Test installing the wheel
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/wilson-*.whl
          cd "$RUNNER_TEMP"
          venv/bin/python -c "import wilson; print(wilson.__version__)"
          venv/bin/wcxf --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Publish to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
